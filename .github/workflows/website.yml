# SPDX-License-Identifier: MIT
# Check the site (check.sh), build it and deploy it to GitHub Pages, as gohugo.io's "Host on GitHub
# Pages" does, with the Hugo release and Dart Sass that npm installs (package.json): a released
# Hugo, so the site exercises docsygen's template reader. docsygen has no release yet: it is
# checked out next to this repository, and local.sh builds with it. Once it is tagged, require it in
# go.mod, drop the second checkout and call hugo directly. A pull request checks and builds the site
# without deploying it.
#
# The reference's XML comes from xml.yml, called once here: it generates it in PDI's image or
# restores it from the cache, and the check and the build both wait for all of it. They are two
# jobs of one workflow so that a cold cache costs one generation of each version, not two racing
# for the same keys.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's run is cancelled by its next push. A run on main never is, and the deployment has
# its own group (below), which never cancels one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  xml:
    uses: ./.github/workflows/xml.yml

  check:
    needs: xml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: pdi-docsygen
      - name: Checkout docsygen
        uses: actions/checkout@v7
        with:
          repository: jbigot/docsygen
          path: docsygen
      - name: Download the XML
        uses: actions/download-artifact@v8
        with:
          pattern: pdi*
          path: pdi-docsygen/assets/doxygen
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: pdi-docsygen/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install npm dependencies (Hugo, Dart Sass, Bootstrap, Font Awesome)
        working-directory: pdi-docsygen
        run: |
          npm install --global npm@11
          npm ci
      - name: Run the tests
        working-directory: pdi-docsygen
        run: sh check.sh

  build:
    needs: xml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: pdi-docsygen
      - name: Checkout docsygen
        uses: actions/checkout@v7
        with:
          repository: jbigot/docsygen
          path: docsygen
      - name: Download the XML
        uses: actions/download-artifact@v8
        with:
          pattern: pdi*
          path: pdi-docsygen/assets/doxygen
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: pdi-docsygen/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install npm dependencies (Hugo, Dart Sass, Bootstrap, Font Awesome)
        working-directory: pdi-docsygen
        run: |
          npm install --global npm@11
          npm ci
      - name: Set up Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        working-directory: pdi-docsygen
        env:
          HUGO_ENVIRONMENT: production
        run: sh build.sh --gc --minify --baseURL "${{ steps.pages.outputs.base_url || 'https://jbigot.github.io/pdi-docsygen' }}/"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pdi-docsygen/public

  deploy:
    if: github.event_name != 'pull_request'
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
