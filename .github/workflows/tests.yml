# Build the site and check it (check.sh), with the Hugo release that npm installs. docsygen has no
# release yet: it is checked out next to this repository, as in pages.yml.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: pdi-docsygen
      - name: Checkout docsygen
        uses: actions/checkout@v7
        with:
          repository: jbigot/docsygen
          path: docsygen
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: pdi-docsygen/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install npm dependencies (Hugo, Dart Sass, Bootstrap, Font Awesome)
        working-directory: pdi-docsygen
        run: |
          npm install --global npm@11
          npm ci
      - name: Run the tests
        working-directory: pdi-docsygen
        run: sh check.sh
